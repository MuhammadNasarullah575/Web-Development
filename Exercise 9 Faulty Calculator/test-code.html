<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faulty Calculator</title>

<style>
    body{
        font-family: Arial, sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:#f4f4f4;
    }

    .calculator{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
        width:300px;
    }

    input, select, button{
        width:100%;
        padding:10px;
        margin:10px 0;
        font-size:18px;
    }

    #result{
        font-size:22px;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="calculator">
    <h2>Faulty Calculator 😈</h2>

    <input type="number" id="num1" placeholder="First Number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Second Number">

    <button onclick="calculate()">Calculate</button>

    <p id="result"></p>
</div>

<script>
function calculate() {

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    let op = document.getElementById("operator").value;

    let result;

    // 10% chance calculator will be faulty
    let faulty = Math.random() < 0.10;

    if(faulty){

        if(op === "+"){
            result = a - b;
        }
        else if(op === "-"){
            result = a / b;
        }
        else if(op === "*"){
            result = a + b;
        }
        else if(op === "/"){
            result = a ** b;
        }

        document.getElementById("result").innerHTML =
            "😈 Faulty Result: " + result;

    } else {

        switch(op){
            case "+":
                result = a + b;
                break;

            case "-":
                result = a - b;
                break;

            case "*":
                result = a * b;
                break;

            case "/":
                result = a / b;
                break;
        }

        document.getElementById("result").innerHTML =
            "✅ Correct Result: " + result;
    }
}
</script>

</body>
</html>
