<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Name Generator</title>
</head>

<body>

    <script>
        let rand = Math.random();
        let first, second, third;


        // Let generate the first words
        rand = Math.random();
        if (rand < 0.33) {
            // 0 0.33 0.66 1
            first = "Crazy";
        }
        else if (rand > 0.33 && rand < 0.66) {
            first = "Amazing"
        }
        else {
            first = "Fire"
        }

        // Let generate the second words
        rand = Math.random();
        if (rand < 0.33) {
            // 0 0.33 0.66 1
            second = "Engine";
        }
        else if (rand > 0.33 && rand < 0.66) {
            second = "Food"
        }
        else {
            second = "Garments"
        }


        // Let generate the third words
        rand = Math.random();
        if (rand < 0.33) {
            // 0 0.33 0.66 1
            third = "Bros";
        }
        else if (rand > 0.33 && rand < 0.66) {
            third = "Limited"
        }
        else {
            third = "Hub"
        }

        let display = "Your Business name is " + first + " " + second + " " + third;

        console.log(display);
    </script>
</body>

</html>
