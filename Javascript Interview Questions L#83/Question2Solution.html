<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question2Solution</title>
</head>
<body>
    
    <script>
        let arr = [1,1,2,3,4,4,5,6,4,7,7,8,9,10,11,12,13,13,14,5,5,6,6,7,19,8]
        let previous = null;
        let result = [];

        let h2 = document.createElement("h2");
        document.body.append(h2);

        for (const index of arr) {
            if(index === previous){
                result.push(index)
            }
            else{
                result.push(index*2);
            }
            previous = index;
        }

        h2.innerHTML = result;
    </script>
</body>
</html>
