<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In to your account</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: sans-serif;
            font-size: 15px;
        }

        .container {
            width: 99%;
            height: 99vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 40%;
            height: 70%;
            border: 1px solid black;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .welcome h2 {
            font-family: sans-serif;
            font-weight: 700;
            font-size: 40px;
            color: orange;
            margin-top: 20px;
        }

        .content {
            width: 90%;
            height: 75%;
            /* border: 2px solid black; */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .content p {
            margin: 5px 0;
            font-size: 18px;
            /* color: blueviolet; */
        }

        .content input {
            width: 60%;
            height: 5vh;
        }

        .sign-btn {
            background-color: orange;
            border: none;
            color: white;
            margin-top: auto;
            padding: 10px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .elements {
            margin: 10px 0;
        }

        .sign-btn a {
            text-decoration: none;
            color: white;
        }

        .register-btn {
            background-color: green;
        }

        h5 {
            text-align: center;
        }
        .btns{
            display: flex;
            flex-direction: column;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="welcome">
                <h2>Welcome to Tijaaro!</h2>
            </div>

            <div class="content">
                <div class="elements">
                    <p>Email:</p>
                    <input type="email" placeholder="Enter your Email" id="email">
                </div>

                <div class="elements">
                    <p>Password:</p>
                    <input type="password" placeholder="Enter your password" id="password">
                </div>

                <div class="btns">
                    <button class="sign-btn">Sign In</button>
                    <h5>OR</h5>
                    <button class="sign-btn register-btn">Register</button>
                </div>

            </div>


        </div>
    </div>


    <script>
        let signIn = document.querySelector(".sign-btn");
        let email = document.querySelector("#email");
        let password = document.querySelector("#password");
        let registerBtn = document.querySelector(".register-btn");

        signIn.addEventListener("click", () => {
            let savedUser = JSON.parse(localStorage.getItem("user"));
            if (!savedUser) {
                alert("No account Found. Please Register First")
            }
            else if(email.value === "" || password.value == ""){
                alert("Please fill each field")
            }
            else if (email.value === savedUser.Email && password.value === savedUser.pass) {
                alert("Login Successful!")
                window.location.href = "Dashboard.html";
            }
            else {
                alert("Invalid Username or Password")
            }

        })
        registerBtn.addEventListener("click", () => {
            window.location.href = "Question4Solution.html";
        })
    </script>
</body>

</html>
