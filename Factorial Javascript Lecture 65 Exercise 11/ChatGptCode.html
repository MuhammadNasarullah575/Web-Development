<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: gainsboro;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 60vw;
            margin: 50px auto;
            height: 70vh;
            border-radius: 10px;
            background-color: rgb(198, 0, 247);
            color: white;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        h1 {
            margin-top: 30px;
        }

        .display {
            margin-top: 40px;
        }

        .display input {
            padding: 12px 20px;
            width: 30vw;
            font-size: 18px;
            border: none;
            border-radius: 5px;
        }

        .button {
            width: 100%;
            height: calc(100% - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background-color: rgb(128, 243, 124);
            color: black;
            padding: 15px 30px;
            border: none;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
        }

        /* Popup */

        .popup {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .popup-content {
            width: 350px;
            background: white;
            color: black;
            margin: 180px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            position: relative;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
        }

        #result {
            margin: 20px 0;
            font-size: 22px;
        }

        #okBtn {
            padding: 10px 25px;
            border: none;
            background: rgb(198, 0, 247);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="calculator">

            <h1>Factorial Calculator</h1>

            <div class="display">
                <input type="number" placeholder="Enter any number">
            </div>

            <div class="button">
                <button class="btn">
                    Calculate
                </button>
            </div>

        </div>
    </div>


    <!-- Popup -->

    <div class="popup">

        <div class="popup-content">

            <span class="close">&times;</span>

            <h2>Result</h2>

            <p id="result"></p>

            <button id="okBtn">OK</button>

        </div>

    </div>


    <script>

        let Input = document.querySelector("input");
        let Button = document.querySelector(".btn");

        let popup = document.querySelector(".popup");
        let result = document.getElementById("result");

        let close = document.querySelector(".close");
        let okBtn = document.getElementById("okBtn");


        Button.addEventListener("click", function () {

            let x = Number(Input.value);

            if (x < 0 || isNaN(x)) {
                result.innerText =
                    "Please enter a valid number";
            }

            else {

                let arr = Array.from(
                    { length: x },
                    (_, i) => i + 1
                );

                let factorial = arr.reduce(
                    (a, b) => a * b,
                    1
                );

                result.innerText =
                    `Factorial of ${x} is ${factorial}`;
            }

            popup.style.display = "block";
        });


        close.addEventListener("click", function () {
            popup.style.display = "none";
        });


        okBtn.addEventListener("click", function () {
            popup.style.display = "none";
        });

    </script>

</body>

</html>
