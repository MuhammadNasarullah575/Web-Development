<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Practice on Dynamic website</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .container{
            max-width: 50vw;
            height: 99vh;
            margin-left: auto;
            /* border: 2px solid black; */
            overflow-y: auto;
        }
        .cards{
            width: 95%;
            height: 120px;
            /* border: 2px solid black; */
            margin: 10px 0;
            padding: 10px 5px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            gap: 5px;
            /* align-items: center; */
        }
        .image{
            position: relative;
        }

        .time{
            position: absolute;
            bottom: 9px;
            right: 3px;
            /* border: 2px solid black; */
            background-color: rgb(0, 0, 0);
            opacity: 0.7;
            color: white;
            z-index: 10;
            border-radius: 2px;

        }
     
    </style>
</head>
<body>
    <div class="container">
        <div class="cards">
            <div class="image">
                <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEmCMQBEG5IWvKriqkDGQgBFQAAiEIYAdgBAeIBCggYEAIYBjgBQAE=&rs=AOn4CLA5x0rcbtKnJz4e0WJDyiuniijfCQ" alt="">

                <div class="time">31:20</div>
            </div>
            <div class="title">
                <h2>Basic Structure of an HTML website</h2>
                <p>2.6M views . 2 Years ago</p>
            </div>
            
        </div>
    </div>

    <script src="selfScript.js"></script>
</body>
</html>
