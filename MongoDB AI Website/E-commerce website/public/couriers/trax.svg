<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <defs>
    <linearGradient id="traxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <linearGradient id="traxRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
  </defs>

  <!-- Clean Dark Badge -->
  <rect width="240" height="76" rx="16" fill="url(#traxBg)" stroke="#2B2D35" stroke-width="1.5" />

  <!-- Trax Fast Delivery Speed Icon -->
  <g transform="translate(18, 18)">
    <circle cx="20" cy="20" r="18" fill="url(#traxRed)" />
    <!-- Dynamic fast-forward chevrons -->
    <path d="M14 12 L22 20 L14 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M21 12 L29 20 L21 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
  </g>

  <!-- Trax Typography -->
  <g transform="translate(68, 47)">
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="29" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">tra</tspan>
      <tspan fill="#FF3333">x</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="70" y="62" fill="#8E93A0" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="8" letter-spacing="2">
    SONIC LOGISTICS
  </text>
</svg>

