<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <defs>
    <linearGradient id="leoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE1A" />
      <stop offset="100%" stop-color="#F5A300" />
    </linearGradient>
    <filter id="leoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Vibrant Gold/Yellow Container -->
  <rect width="240" height="76" rx="16" fill="url(#leoBg)" stroke="#E09200" stroke-width="1.5" filter="url(#leoShadow)" />

  <!-- Leaping Leopard / Cheetah Icon -->
  <g transform="translate(14, 18)">
    <circle cx="20" cy="20" r="19" fill="#111111" />
    <!-- Leopard head silhouette in gold -->
    <path d="M12 28 C10 24 11 18 15 15 C17 13 22 13 25 15 C27 13 29 13 31 16 C33 20 31 24 28 26 L26 29 L21 29 L18 31 Z" fill="#FFBE1A" />
    <!-- Leopard spots & eye -->
    <circle cx="20" cy="18" r="1.8" fill="#111111" />
    <circle cx="16" cy="22" r="1.5" fill="#111111" />
    <circle cx="23" cy="23" r="1.5" fill="#111111" />
    <path d="M26 19 L28 21" stroke="#111111" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(64, 46)">
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="22" letter-spacing="0.5" fill="#111111">
      LEOPARDS
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(65, 60)">
    <rect x="0" y="-8" width="105" height="11" rx="3" fill="#111111" />
    <text x="52" y="0" fill="#FFBE1A" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="7.5" letter-spacing="1.5" text-anchor="middle">
      COURIER EXPRESS
    </text>
  </g>
</svg>

