<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 76" width="100%" height="100%">
  <defs>
    <linearGradient id="pakGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00662B" />
      <stop offset="100%" stop-color="#00471E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F2A900" />
    </linearGradient>
    <filter id="pakShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Royal Green Badge Container -->
  <rect width="240" height="76" rx="16" fill="url(#pakGreen)" stroke="#0E783A" stroke-width="1.5" filter="url(#pakShadow)" />

  <!-- Circular Emblem with Star & Crescent + Post Horn -->
  <g transform="translate(16, 18)">
    <circle cx="20" cy="20" r="19" fill="#003D19" stroke="url(#goldGrad)" stroke-width="1.5" />
    
    <!-- Crescent & Star -->
    <path d="M18 10 C14 10 11 14 11 18 C11 23 15 27 20 27 C23 27 25 25 26 23 C23 24 19 23 17 20 C15 17 16 13 18 10 Z" fill="url(#goldGrad)" />
    <!-- 5-point Star -->
    <polygon points="23,12 24.5,15.5 28,15.5 25,17.5 26.5,21 23,19 19.5,21 21,17.5 18,15.5 21.5,15.5" fill="url(#goldGrad)" transform="scale(0.8) translate(8, 2)" />
    
    <!-- Post Horn curve -->
    <path d="M12 28 C16 32 26 32 30 27" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(64, 38)">
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="0.5" fill="#FFFFFF">
      PAKISTAN
    </text>
    <text x="0" y="17" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="16" letter-spacing="1" fill="url(#goldGrad)">
      POST
    </text>
  </g>

  <!-- Tagline badge -->
  <g transform="translate(148, 55)">
    <rect x="0" y="-8" width="80" height="11" rx="3" fill="#003D19" stroke="url(#goldGrad)" stroke-width="0.8" />
    <text x="40" y="0" fill="#FFE066" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="6.5" letter-spacing="1.2" text-anchor="middle">
      EXPRESS
    </text>
  </g>
</svg>

